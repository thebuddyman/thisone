name: test

on:
  push:
    branches: [main]
  pull_request:

# The browser suites share one server on port 3131 and must run one at a time.
# One job per ref is enough to keep two pushes from racing the same runner.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Pack check
        run: npm pack --dry-run
